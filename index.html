<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Black November · كهرباء أبو غوش</title>
<meta name="description" content="شهر كامل من العروض اللي ما بتتكرر. خصومات حتى 70% من 1 لـ 30 نوفمبر بكل فروع كهرباء أبو غوش.">
<meta property="og:title" content="Black November · كهرباء أبو غوش">
<meta property="og:description" content="خصومات حتى 70% · من 1 لـ 30 نوفمبر بكل الفروع">
<meta property="og:image" content="img/hero.webp">
<meta name="theme-color" content="#050505">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;900&family=Montserrat:wght@600;900&display=swap" rel="stylesheet">
<style>
  :root { --red: #E30613; --red-ink: #D40012; --bg: #050505; --paper: #F4F2EE; --card: #fff; --ink: #1C1B1A; --ink2: #6E6A64; --line: #222; --hair: #E7E3DC; --mute: #8a8a8f; --wa: #1fa855; --wa-ink: #0F7A37; --wa-tint: #E6F5EC; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; scroll-padding-top: 118px; }
  body { background: var(--bg); color: #fff; font-family: "Alexandria", system-ui, sans-serif; font-weight: 500; overflow-x: hidden; }
  .n { font-family: "Montserrat", sans-serif; font-weight: 900; direction: ltr; unicode-bidi: isolate; }
  .shk { height: .55em; width: auto; display: inline-block; vertical-align: baseline; margin-inline-start: .12em; }
  img { display: block; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  /* hero */
  .hero { position: relative; height: 100svh; min-height: 560px; background: #050505 url(img/hero.webp) center/contain no-repeat; }
  @media (min-aspect-ratio: 9/16) { .hero { background-size: cover; } }
  .hero-go { position: absolute; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--red); padding: 12px 26px 14px;
             border-radius: 40px; font-weight: 900; font-size: 17px; box-shadow: 0 10px 30px #e3061366; white-space: nowrap; animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translate(-50%, -6px); } }

  /* sticky bar */
  .bar { position: sticky; top: 0; z-index: 20; background: #050505f2; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .bar-top { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 6px; gap: 10px; }
  .bar-top .ag { height: 30px; }
  .search { flex: 1; display: flex; align-items: center; gap: 8px; background: #1c1c1e; border-radius: 12px; padding: 0 12px; height: 40px; }
  .search input { flex: 1; background: none; border: 0; outline: 0; color: #fff; font: inherit; font-size: 15px; min-width: 0; }
  .search svg { width: 18px; fill: var(--mute); flex: none; }
  .chips { display: flex; gap: 8px; padding: 6px 14px 10px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 8px 15px; border-radius: 20px; background: #1c1c1e; color: #ccc; font-size: 14px; white-space: nowrap; }
  .chip.on { background: var(--red); color: #fff; font-weight: 700; }

  /* sections */
  #list { background: var(--paper); color: var(--ink); padding-bottom: 10px; }
  section.cat { padding: 20px 14px 8px; }
  .cover { width: 100%; aspect-ratio: 1; border-radius: 22px; overflow: hidden; background: #111; margin-bottom: 16px; box-shadow: 0 10px 30px #0000001f; }
  .cover img { width: 100%; height: 100%; object-fit: cover; }
  .cat-h { display: flex; justify-content: space-between; align-items: baseline; margin: 2px 2px 12px; }
  .cat-h h2 { font-size: 22px; font-weight: 900; }
  .cat-h span { font-size: 13px; color: var(--ink2); }
  /* card: 8px grid · 2 cols, 12px gutter · brand 16 → image 120 → title 2 lines → tags 1 line → price row */
  .grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; }
  .card { background: var(--card); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; text-align: right; color: var(--ink);
          box-shadow: 0 1px 2px #0000000a, 0 6px 18px #00000010; }
  .brand { height: 26px; display: flex; align-items: center; justify-content: center; }
  .brand img { filter: brightness(0); opacity: .78; }
  .brand b { font-family: "Montserrat"; font-weight: 900; font-size: 11px; letter-spacing: .5px; color: var(--ink2); }
  .pic { height: 120px; margin: 8px 0 12px; display: flex; align-items: center; justify-content: center; }
  .pic img { max-width: 100%; max-height: 120px; object-fit: contain; }
  .nm b { font-weight: 700; }
  .nm span { font-weight: 500; color: #4A4641; }
  .nm { font-size: 14px; font-weight: 500; line-height: 20px; max-height: 40px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; color: var(--ink); }
  .tags { font-size: 11.5px; line-height: 16px; margin-top: 2px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .foot { display: flex; align-items: flex-end; justify-content: space-between; margin-top: auto; padding-top: 8px; gap: 8px; }
  .pr { display: flex; flex-direction: column; align-items: flex-start; }
  .pr .o { font-size: 12px; line-height: 16px; color: #9A958E; text-decoration: line-through; font-weight: 600; }
  .pr .p { font-size: 22px; line-height: 26px; color: var(--red-ink); }
  .card .wa { width: 40px; height: 40px; padding: 0; border-radius: 50%; background: var(--wa-tint); flex: none; }
  .card .wa svg { width: 20px; fill: var(--wa-ink); }
  .wa { background: var(--wa); border-radius: 12px; padding: 9px; display: flex; gap: 6px; justify-content: center; align-items: center; font-weight: 700; font-size: 14px; color: #fff; text-decoration: none; }
  .wa svg { width: 17px; fill: #fff; }
  .empty { padding: 60px 20px; text-align: center; color: var(--ink2); }

  /* sheet */
  .veil { position: fixed; inset: 0; background: #000a; z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: #fff; color: var(--ink); border-radius: 26px 26px 0 0; padding: 10px 18px max(18px, env(safe-area-inset-bottom));
           transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1); max-height: 92svh; overflow-y: auto; }
  .open .veil { opacity: 1; pointer-events: auto; }
  .open .sheet { transform: none; }
  .grab { width: 44px; height: 5px; border-radius: 3px; background: #D6D1C9; margin: 0 auto 10px; }
  .sh-top { display: flex; justify-content: space-between; align-items: center; direction: ltr; }
  .sh-top img { filter: brightness(0); opacity: .85; }
  .sh-pic { height: 260px; display: flex; align-items: center; justify-content: center; margin: 12px 0; }
  .sh-pic img { max-width: 100%; max-height: 260px; object-fit: contain; }
  .sh-nm { font-size: 20px; font-weight: 500; line-height: 1.35; } .sh-nm b { font-weight: 900; } .sh-nm span { color: #4A4641; }
  .sh-spec { color: var(--ink2); font-size: 13px; margin-top: 4px; }
  .sh-pr { display: flex; justify-content: space-between; align-items: flex-end; margin: 16px 0; }
  .sh-pr .p { font-size: 44px; color: var(--red-ink); line-height: 1; }
  .sh-pr .o { font-size: 15px; color: #9A958E; text-decoration: line-through; }
  .save { background: #FDECEC; color: var(--red-ink); border-radius: 10px; padding: 6px 12px; font-size: 14px; font-weight: 700; }
  .sh-btns { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
  .sh-btns .wa { font-size: 16px; height: 52px; padding: 0 16px; border-radius: 14px; }
  .share { background: #F1EEE9; border-radius: 14px; width: 52px; justify-content: center; display: flex; align-items: center; }
  .share svg { width: 22px; fill: var(--ink); }

  footer { background: var(--bg); padding: 30px 18px 40px; text-align: center; color: var(--mute); font-size: 13px; line-height: 1.9; border-top: 1px solid var(--line); }
  footer .ag { height: 44px; margin: 0 auto 12px; }
  footer b { color: #fff; }
  .x { display: none; }
  .card { cursor: pointer; transition: transform .18s ease, box-shadow .18s ease; }

  /* قائمة الاستفسار: كذا صنف برسالة واتساب وحدة */
  .acts { display: flex; gap: 6px; flex: none; }
  .add { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--hair); background: #fff; color: var(--ink); font: 600 22px/1 inherit; display: flex; align-items: center; justify-content: center; padding: 0; transition: background .15s, color .15s, border-color .15s; }
  .add.on { background: var(--ink); border-color: var(--ink); color: #fff; font-size: 17px; }
  .addl { grid-column: 1 / -1; height: 48px; border-radius: 14px; border: 1.5px solid var(--hair); background: #fff; color: var(--ink); font: 700 15px inherit; }
  .addl.on { background: #F1EEE9; border-color: #F1EEE9; }
  #lbar { position: fixed; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 30; display: flex; align-items: center; gap: 10px;
          background: var(--ink); color: #fff; border: 0; border-radius: 16px; padding: 0 14px 0 8px; height: 58px; font: inherit; text-align: right;
          box-shadow: 0 10px 30px rgba(0,0,0,.35); transform: translateY(160%); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
  #lbar.show { transform: none; }
  #lbar.bump { animation: bump .35s ease; }
  @keyframes bump { 40% { transform: scale(1.04); } }
  #lbar .cnt { background: var(--red); min-width: 30px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; padding: 0 8px; }
  #lbar .lt { flex: 1; font-size: 14px; line-height: 1.3; } #lbar .lt b { display: block; font-size: 15px; } #lbar .lt span { color: #B9B4AC; font-size: 12.5px; }
  #lbar .go { background: var(--wa); border-radius: 12px; height: 42px; padding: 0 14px; display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; }
  #lbar .go svg { width: 18px; fill: #fff; }
  body.has-list footer { padding-bottom: 100px; }
  .lh { font-size: 20px; font-weight: 800; margin: 4px 0 2px; } .lsub { color: var(--ink2); font-size: 13px; margin-bottom: 12px; }
  .lrow { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--hair); }
  .lrow img { width: 56px; height: 56px; object-fit: contain; border-radius: 10px; background: #F6F4F0; flex: none; }
  .lrow .li { flex: 1; min-width: 0; font-size: 14px; line-height: 1.4; } .lrow .li b { font-weight: 700; } .lrow .li small { display: block; color: var(--ink2); font-size: 12px; }
  .lrow .lp { font-weight: 700; color: var(--red-ink); font-size: 16px; white-space: nowrap; }
  .lrow .lx { width: 34px; height: 34px; border-radius: 50%; border: 0; background: #F1EEE9; color: var(--ink2); font-size: 15px; flex: none; }
  .ltot { display: flex; justify-content: space-between; align-items: baseline; margin: 14px 0 16px; font-size: 15px; } .ltot b { font-size: 26px; color: var(--ink); } .ltot small { color: var(--ink2); font-size: 12px; }
  .lclear { display: block; margin: 12px auto 0; background: none; border: 0; color: var(--ink2); font: 500 13px inherit; text-decoration: underline; }
  @media (max-width: 759px) {
    .card .wa, .add { width: 36px; height: 36px; } .card .wa svg { width: 18px; } .add { font-size: 20px; } .add.on { font-size: 15px; }
    .acts { gap: 5px; } .card .foot { gap: 4px; }
  }
  @media (min-width: 760px) {
    #lbar { left: 50%; right: auto; width: 460px; margin-left: -230px; bottom: 20px; cursor: pointer; }
    .add, .addl, .lx, .lclear { cursor: pointer; }
    .add:hover { border-color: var(--ink); }
  }

  /* ── desktop & tablet ── */
  @media (min-width: 760px) {
    html { scroll-padding-top: 130px; }
    .bar-top, .chips { max-width: 1240px; margin: 0 auto; }
    .bar-top { padding: 12px 24px 8px; }
    .bar-top .ag { height: 36px; }
    .search { max-width: 460px; }
    .chips { padding: 6px 24px 12px; justify-content: center; flex-wrap: wrap; overflow: visible; }
    .chip { padding: 7px 13px; font-size: 13.5px; }
    .hero { height: min(88vh, 900px); min-height: 520px;
            background: #030303 url(img/hero-desk.webp) center/contain no-repeat; }
    section.cat { max-width: 1240px; margin: 0 auto; padding: 40px 24px 8px; display: grid; grid-template-columns: 300px 1fr; gap: 32px; align-items: start; }
    .cover { position: sticky; top: calc(var(--bar-h, 120px) + 20px); margin: 0; }
    .cat-h { grid-column: 1 / -1; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 16px; }
    .card:hover { transform: translateY(-3px); box-shadow: 0 2px 4px #0000000d, 0 14px 30px #00000017; }
    .card .wa:hover { background: #d5efdf; }
    .pic { height: 150px; } .pic img { max-height: 150px; }
    .empty { max-width: 1240px; margin: 0 auto; }
    /* product sheet becomes a centered dialog */
    .sheet { left: 50%; right: auto; top: 50%; bottom: auto; width: min(920px, 92vw); max-height: 86vh; border-radius: 24px; padding: 32px;
             display: grid; grid-template-columns: 1.1fr 1fr; gap: 32px; align-items: center;
             transform: translate(-50%, -47%) scale(.98); opacity: 0; pointer-events: none; transition: transform .22s ease, opacity .22s ease; }
    .open .sheet { transform: translate(-50%, -50%); opacity: 1; pointer-events: auto; }
    .grab { display: none; }
    .x { display: flex; position: absolute; top: 14px; left: 14px; width: 36px; height: 36px; border-radius: 50%; background: #F1EEE9; font-size: 22px; line-height: 1;
         align-items: center; justify-content: center; color: var(--ink); }
    .sh-pic { height: 380px; } .sh-pic img { max-height: 380px; }
    .sh-nm { font-size: 24px; }
    .wa, .share, .chip, .hero-go { cursor: pointer; }
    footer { font-size: 14px; }
  }
  @media (min-width: 1200px) { section.cat { grid-template-columns: 340px 1fr; } }
  /* gifts / draw */
  section.gifts { padding-top: 20px; }
  .gbox { background: #0b0b0c; color: #fff; border-radius: 22px; overflow: hidden; box-shadow: 0 10px 30px #0000002a; }
  .gtext { padding: 22px 20px 6px; text-align: center; }
  .gkick { display: inline-block; font-size: 13px; color: #ff6b72; background: #e3061322; border-radius: 20px; padding: 4px 12px; margin-bottom: 10px; }
  .gh { font-size: 28px; font-weight: 900; line-height: 1.25; }
  .gh span { color: #ff3a46; display: block; white-space: nowrap; }
  .gsub { font-size: 14px; line-height: 1.6; opacity: .85; margin: 8px 0 12px; }
  .glist { list-style: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .glist li { font-size: 14px; padding: 6px 14px 8px; border-radius: 20px; background: #ffffff12; border: 1px solid #ffffff2e; }
  .glist li.more { border-color: #e30613; background: #e3061322; }
  .gimg img { width: 100%; display: block; }
  .chip.gift-chip { background: #2a1416; color: #ff8a90; }
  .chip.gift-chip.on { background: var(--red); color: #fff; }
  @media (min-width: 760px) {
    section.cat.gifts { display: block; }
    .gbox { display: grid; grid-template-columns: 1fr 1.25fr; align-items: center; }
    .gtext { padding: 32px 36px; text-align: right; }
    .gh { font-size: 38px; } .gsub { font-size: 16px; } .glist { justify-content: flex-start; } .glist li { font-size: 15px; }
  }
  /* wedding packages */
  section.wed { padding-top: 26px; }
  .whead { text-align: center; padding: 0 6px 12px; }
  .wkick { display: inline-block; font-size: 13px; color: #8a5a2b; background: #f3e6d6; border-radius: 20px; padding: 4px 12px; margin-bottom: 8px; }
  .whead h2 { font-size: 24px; font-weight: 900; line-height: 1.3; } .whead h2 span { color: var(--red-ink); }
  .whead p { font-size: 13.5px; color: var(--ink2); margin-top: 6px; line-height: 1.6; }
  .wbuds { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 14px; }
  .wbud { padding: 7px 14px; border-radius: 20px; background: #fff; border: 1px solid var(--hair); font-size: 13.5px; color: var(--ink); }
  .wbud.on { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 700; }
  .wscroll { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -14px; padding: 4px 14px 12px; scrollbar-width: none; }
  .wscroll::-webkit-scrollbar { display: none; }
  .wcard { flex: 0 0 82%; scroll-snap-align: center; background: #0b0b0c; border-radius: 18px; overflow: hidden; box-shadow: 0 6px 18px #0000001f; text-align: right; color: #fff; cursor: pointer; }
  .wcard img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .wmeta { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px 12px; font-size: 15px; }
  .wmeta .n { color: #ff3a46; font-size: 20px; }
  .whint { text-align: center; font-size: 12px; color: var(--ink2); }
  .chip.wed-chip { background: #2a2116; color: #e9c9a0; } .chip.wed-chip.on { background: var(--red); color: #fff; }
  .wimg { width: 100%; border-radius: 16px; display: block; }
  .wl-h { font-weight: 900; font-size: 15px; margin: 14px 0 8px; }
  .wl { list-style: none; display: grid; gap: 6px; }
  .wl li { display: flex; align-items: baseline; gap: 6px; font-size: 14px; background: #F6F4F0; border-radius: 10px; padding: 8px 12px; }
  .wl li span { color: #4A4641; } .wl li em { margin-inline-start: auto; font-style: normal; font-size: 12px; color: var(--ink2); }
  .wg { display: flex; flex-wrap: wrap; gap: 6px; } .wg span { font-size: 12.5px; padding: 5px 10px; border-radius: 16px; background: #FDECEC; color: var(--red-ink); }
  @media (min-width: 760px) {
    section.cat.wed { display: block; }
    .wscroll { display: grid; grid-template-columns: repeat(4, 1fr); overflow: visible; margin: 0; padding: 4px 0 12px; }
    .wcard { flex: none; } .wcard:hover { transform: translateY(-3px); } .whint { display: none; }
    .whead h2 { font-size: 32px; }
  }
</style>
</head>
<body>
  <div class="hero" role="img" aria-label="Black November · كهرباء أبو غوش · خصومات حتى 70%">
    <button class="hero-go" onclick="document.getElementById('bar').scrollIntoView()">تصفّح العروض ↓</button>
  </div>

  <div class="bar" id="bar">
    <div class="bar-top">
      <label class="search"><svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 1 0 4.9 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z"/></svg>
        <input id="q" type="search" placeholder="دوّر على صنف أو ماركة…" autocomplete="off"></label>
      <img class="ag" src="img/ag.webp" alt="كهرباء أبو غوش">
    </div>
    <nav class="chips" id="chips"></nav>
  </div>

  <main id="list"></main>

  <footer>
    <img class="ag" src="img/ag.webp" alt="">
    <div><b>Black November</b> · من <span class="n">1</span> لـ <span class="n">30</span> نوفمبر</div>
    <div>بكل فروع كهرباء أبو غوش: عطروت · شعفاط · أبو غوش · رأس العامود · كفر عقب</div>
    <div>توصيل لكل المناطق</div>
  </footer>

  <button id="lbar" onclick="openList()" aria-label="افتح قائمتك"><span class="cnt n">0</span><span class="lt"></span><span class="go"></span></button>

  <div id="pop"><div class="veil" onclick="closeSheet()"></div><div class="sheet" id="sheet"></div></div>

<script>
const WA_NUM = "972592815158";
const SHK = '<svg class="shk" viewBox="0 0 90 88"><path d="M6.5 88V18Q6.5 6.5 18 6.5H44.5Q56 6.5 56 18V62M83.5 0V70Q83.5 81.5 72 81.5H41.5Q30 81.5 30 70V26" fill="none" stroke="currentColor" stroke-width="13"/></svg>';
const WA = '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.3-.8-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>';
const SHARE = '<svg viewBox="0 0 24 24"><path d="M18 16a3 3 0 0 0-2.4 1.2l-6.7-3.4a3 3 0 0 0 0-1.6l6.7-3.4A3 3 0 1 0 15 7l-6.7 3.4a3 3 0 1 0 0 3.2L15 17a3 3 0 1 0 3-1z"/></svg>';
let D, BYID = {};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = it => Math.round(100 - it.price * 100 / it.old);
const title = it => `${it.name}${it.size ? " " + it.size : ""}${it.brand ? " " + it.brand : ""}`;
const waLink = it => `https://wa.me/${WA_NUM}?text=${encodeURIComponent(`مرحبا، بدي اطلب من عروض Black November:\n${title(it)}${it.spec ? " (" + it.spec + ")" : ""}\nموديل: ${it.model}\nالسعر: ${it.price} ₪`)}`;
const brandHtml = (it, k = 1) => {
  if (!it.logo) return `<b>${esc(it.brand)}</b>`;
  const [f, ar] = it.logo, hh = Math.min(26, Math.sqrt(1300 / ar)) * k, w = Math.min(92 * k, hh * ar);
  return `<img src="img/${f}.webp" alt="${esc(it.brand)}" style="width:${w.toFixed(1)}px;height:${(w / ar).toFixed(1)}px">`;
};

function card(it) {
  return `<article class="card" data-id="${it.id}">
    <div class="brand">${brandHtml(it)}</div>
    <div class="pic"><img src="img/${it.img}-s.webp" alt="${esc(title(it))}" loading="lazy" decoding="async"></div>
    <div class="nm"><b>${esc(it.name)}</b>${it.size ? ` <span>${esc(it.size)}</span>` : ""}</div>
    ${it.spec ? `<div class="tags">${esc(it.spec)}</div>` : ""}
    <div class="foot">
      <div class="pr"><span class="p n">${it.price}${SHK}</span><span class="o n">${it.old}${SHK}</span></div>
      <div class="acts">${addBtn("p:" + it.id)}<a class="wa" href="${waLink(it)}" target="_blank" rel="noopener" aria-label="اطلب بالواتساب" onclick="event.stopPropagation()">${WA}</a></div>
    </div>
  </article>`;
}
// the Black November draw: any purchase from the offers enters it (Hamza, 2026-10-22)
const GIFTS = `<section class="cat gifts" id="c-gifts">
  <div class="gbox">
    <div class="gtext">
      <div class="gkick">سحب <span class="n" style="font-weight:600">Black November</span></div>
      <h2 class="gh">الخصم إلك.. <span>والهدية كمان!</span></h2>
      <p class="gsub">اشتري أي قطعة من عروض <span dir="ltr" style="unicode-bidi:isolate">Black November</span> وادخل السحب على:</p>
      <ul class="glist">
        <li><span dir="ltr" style="unicode-bidi:isolate">iPhone 18</span></li><li><span dir="ltr" style="unicode-bidi:isolate">PlayStation 5</span></li>
        <li>تلفزيون 100 بوصة</li><li>سكوتر كهرباء</li><li>بسكليت كهرباء</li><li class="more">والعديد من الهدايا القيمة</li>
      </ul>
    </div>
    <div class="gimg"><img src="img/gifts.webp" alt="هدايا سحب Black November: iPhone 18، PlayStation 5، تلفزيون 100 بوصة، سكوتر وبسكليت كهرباء" loading="eager"></div>
  </div>
</section>`;
// عروض العرسان (نفس بكجات عرض الخريف وأسعارها، بثيم Black November) — حمزة، 2026-10-24
let WED = [], BUD = "all";
const BUDS = [["all", "الكل"], ["lo", "تحت 6000"], ["mid", "6000 – 10000"], ["hi", "فوق 10000"]];
const inBud = p => BUD === "all" || (BUD === "lo" ? p.price < 6000 : BUD === "mid" ? p.price <= 10000 && p.price >= 6000 : p.price > 10000);
const WGIFTS = ["مكنسة كهربائية", "مايكرويف", "كمكم", "توستر", "سشوار", "خلاط يد مع خفاقة وعصارة"];
function wedSection() {
  if (!WED.length) return "";
  const ps = WED.filter(inBud);
  return `<section class="cat wed" id="c-wedding">
    <div class="whead"><div class="wkick">💍 عروض العرسان</div><h2>جهّزوا بيتكم كامل.. <span>من مكان واحد</span></h2>
      <p>8 بكجات كاملة: ثلاجة وغسالة وفرن وطباخ وتلفزيون، ومع كل بكج 6 هدايا</p></div>
    <div class="wbuds">${BUDS.map(([k, l]) => `<button class="wbud${BUD === k ? " on" : ""}" data-b="${k}">${l}</button>`).join("")}</div>
    <div class="wscroll">${ps.map(p => `<button class="wcard" data-w="${p.id}" aria-label="بكج ${esc(p.title)} ${p.price} شيكل">
        <img src="img/wed-${p.id}.webp" alt="عرض العرسان ${esc(p.title)}" loading="lazy">
        <span class="wmeta"><b>بكج ${esc(p.title)}</b><span class="n">${p.price}${SHK}</span></span></button>`).join("")}</div>
    ${ps.length > 1 ? `<div class="whint">اسحب لتشوف باقي البكجات ←</div>` : ""}
  </section>`;
}
function openWed(id, push = true) {
  const p = WED.find(x => x.id === id); if (!p) return;
  const wa = `https://wa.me/${WA_NUM}?text=${encodeURIComponent(`مرحبا، بدي بكج العرسان ${p.title} بـ ${p.price} ₪ من عروض Black November`)}`;
  $("#sheet").innerHTML = `<div class="grab"></div><button class="x" onclick="closeSheet()" aria-label="سكّر">×</button>
    <div class="sh-media"><img class="wimg" src="img/wed-${p.id}.webp" alt="عرض العرسان ${esc(p.title)}"></div>
    <div class="sh-info"><div class="sh-nm"><b>بكج العرسان ${esc(p.title)}</b></div>
      <div class="wl-h">البكج بيشمل</div>
      <ul class="wl">${p.items.map(i => `<li><b>${esc(i.name)}</b>${i.spec ? ` <span>${esc(i.spec)}</span>` : ""}<em>${esc(i.brand)}</em></li>`).join("")}</ul>
      <div class="wl-h">ومع البكج هدايا 🎁</div>
      <div class="wg">${WGIFTS.map(g => `<span>${g}</span>`).join("")}</div>
      <div class="sh-pr"><div><div class="p n">${p.price}${SHK}</div><div class="o n">${p.old}${SHK}</div></div><span class="save">وفّر <span class="n">${p.old - p.price}</span> ₪</span></div>
      <div class="sh-btns"><a class="wa" href="${wa}" target="_blank" rel="noopener">${WA} بدي هالبكج</a>
      <button class="share" onclick="shareWed('${p.id}')" aria-label="شارك">${SHARE}</button>${addBig("w:" + p.id)}</div></div>`;
  $("#pop").classList.add("open");
  if (push) history.pushState({ w: id }, "", "#w=" + id);
}
async function shareWed(id) {
  const p = WED.find(x => x.id === id), url = location.href.split("#")[0] + "#w=" + id;
  const text = `بكج العرسان ${p.title} بـ ${p.price} ₪ بدل ${p.old} ₪ · عروض Black November من كهرباء أبو غوش`;
  if (navigator.share) { try { await navigator.share({ title: "عروض العرسان", text, url }); } catch (e) {} }
  else window.open(`https://wa.me/?text=${encodeURIComponent(text + "\n" + url)}`, "_blank");
}
// قائمة الاستفسار: الزبون بيجمع كذا صنف وبيبعتهم برسالة واتساب وحدة (حمزة، 2026-10-24)
let LIST = [];
try { LIST = JSON.parse(localStorage.getItem("bn-list") || "[]"); } catch (e) {}
const inList = k => LIST.includes(k);
const addBtn = k => `<button class="add${inList(k) ? " on" : ""}" data-k="${k}" aria-label="ضيف للقائمة">${inList(k) ? "✓" : "＋"}</button>`;
const addBig = k => `<button class="addl${inList(k) ? " on" : ""}" data-k="${k}" onclick="toggleList('${k}')">${inList(k) ? "✓ بقائمتك" : "＋ ضيفه لقائمتك واسأل عن كذا صنف مع بعض"}</button>`;
function lget(k) {
  const [t, id] = k.split(":");
  if (t === "w") { const p = WED.find(x => x.id === id); return p && { name: `بكج العرسان ${p.title}`, sub: "عروض العرسان", model: "", price: p.price, img: `img/wed-${p.id}.webp` }; }
  const it = BYID[id]; return it && { name: title(it), sub: it.spec, model: it.model, price: it.price, img: `img/${it.img}-s.webp` };
}
const lItems = () => LIST.map(k => [k, lget(k)]).filter(x => x[1]);
function saveList() { try { localStorage.setItem("bn-list", JSON.stringify(LIST)); } catch (e) {} }
function toggleList(k) {
  const add = !inList(k);
  LIST = add ? [...LIST, k] : LIST.filter(x => x !== k); saveList();
  document.querySelectorAll(`[data-k="${k}"]`).forEach(b => {
    b.classList.toggle("on", add);
    b.textContent = b.classList.contains("add") ? (add ? "✓" : "＋") : (add ? "✓ بقائمتك" : "＋ ضيفه لقائمتك واسأل عن كذا صنف مع بعض");
  });
  lbar(add);
}
function lbar(bump) {
  const its = lItems(), b = $("#lbar"), n = its.length;
  b.classList.toggle("show", n > 0); document.body.classList.toggle("has-list", n > 0);
  if (!n) return;
  b.querySelector(".cnt").textContent = n;
  b.querySelector(".lt").innerHTML = `<b>${n === 1 ? "صنف واحد" : n === 2 ? "صنفين" : n + " أصناف"} بقائمتك</b><span>المجموع <span class="n">${its.reduce((s, [, x]) => s + x.price, 0)}</span> ₪</span>`;
  if (bump) { b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump"); }
}
function listWa() {
  const its = lItems().map(([, x]) => x);
  const lines = its.map((x, i) => `${i + 1}. ${x.name}${x.model ? ` (موديل ${x.model})` : ""} · ${x.price} ₪`);
  const msg = `مرحبا، بدي أسأل عن هدول من عروض Black November:\n${lines.join("\n")}\nالمجموع: ${its.reduce((s, x) => s + x.price, 0)} ₪`;
  return `https://wa.me/${WA_NUM}?text=${encodeURIComponent(msg)}`;
}
function openList(push = true) {
  const its = lItems();
  if (!its.length) { closeSheet(); return; }
  $("#sheet").innerHTML = `<div class="grab"></div><button class="x" onclick="closeSheet()" aria-label="سكّر">×</button>
    <div class="sh-info lsheet"><div class="lh">قائمتك</div><div class="lsub">ابعتها برسالة وحدة، وفريق أبو غوش بيرد عليك بكل التفاصيل</div>
    ${its.map(([k, x]) => `<div class="lrow"><img src="${x.img}" alt=""><div class="li"><b>${esc(x.name)}</b>${x.sub || x.model ? `<small>${esc([x.sub, x.model && "موديل " + x.model].filter(Boolean).join(" · "))}</small>` : ""}</div>
      <span class="lp n">${x.price}${SHK}</span><button class="lx" onclick="toggleList('${k}');openList(false)" aria-label="شيل من القائمة">✕</button></div>`).join("")}
    <div class="ltot"><span>المجموع <small>(تقريبي)</small></span><b class="n">${its.reduce((s, [, x]) => s + x.price, 0)}${SHK}</b></div>
    <a class="wa" style="height:52px;font-size:16px;border-radius:14px" href="${listWa()}" target="_blank" rel="noopener">${WA} ابعت القائمة عالواتس</a>
    <button class="lclear" onclick="if(confirm('بدك تفضّي القائمة؟')){LIST.forEach(k=>toggleList(k));closeSheet()}">فضّي القائمة</button></div>`;
  $("#pop").classList.add("open");
  if (push) history.pushState({ l: 1 }, "", "#list");
}
function render(q = "") {
  q = q.trim().toLowerCase();
  const match = it => !q || (it.name + " " + it.size + " " + it.brand + " " + it.model + " " + it.spec).toLowerCase().includes(q);
  let html = q ? "" : GIFTS + wedSection();
  for (const c of D.cats) {
    const its = D.items.filter(it => it.cat === c.id && match(it)).sort((a, b) => a.price - b.price);
    if (!its.length) continue;
    html += `<section class="cat" id="c-${c.id}">
      ${q ? "" : `<div class="cover"><img src="img/cover-${c.id}.webp" alt="${esc(c.label)}" loading="lazy"></div>`}
      ${q ? `<div class="cat-h"><h2>${esc(c.label)}</h2></div>` : ""}
      <div class="grid">${its.map(card).join("")}</div></section>`;
  }
  $("#list").innerHTML = html || `<div class="empty">ما لقينا «${esc(q)}». جرّب اسم ماركة أو نوع جهاز.</div>`;
  watch();
}
function chips() {
  $("#chips").innerHTML = `<button class="chip gift-chip" data-c="gifts">🎁 الهدايا</button><button class="chip wed-chip" data-c="wedding">💍 العرسان</button>` + D.cats.map(c => `<button class="chip" data-c="${c.id}">${esc(c.label)}</button>`).join("");
  $("#chips").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    if ($("#q").value) { $("#q").value = ""; render(); }
    document.getElementById("c-" + b.dataset.c)?.scrollIntoView();
  });
}
function watch() {}
// scroll only the chips row sideways; scrollIntoView on a chip inside the sticky bar also scrolls the page on mobile (the jump-up bug)
function centerChip(ch) {
  const row = $("#chips"), cr = row.getBoundingClientRect(), r = ch.getBoundingClientRect();
  row.scrollBy({ left: (r.left + r.width / 2) - (cr.left + cr.width / 2), behavior: "smooth" });
}
let tick = false;
window.addEventListener("scroll", () => {
  if (tick) return; tick = true;
  requestAnimationFrame(() => {
    tick = false; let cur = null;
    for (const s of document.querySelectorAll("section.cat")) { if (s.getBoundingClientRect().top <= $("#bar").offsetHeight + 30) cur = s.id.slice(2); else break; }
    document.querySelectorAll(".chip").forEach(ch => {
      const on = ch.dataset.c === cur;
      if (on && !ch.classList.contains("on")) centerChip(ch);
      ch.classList.toggle("on", on);
    });
  });
}, { passive: true });
function openSheet(id, push = true) {
  const it = BYID[id]; if (!it) return;
  $("#sheet").innerHTML = `<div class="grab"></div><button class="x" onclick="closeSheet()" aria-label="سكّر">×</button>
    <div class="sh-media"><div class="sh-top"><div>${brandHtml(it, 1.35)}</div></div>
    <div class="sh-pic"><img src="img/${it.img}-l.webp" alt="${esc(title(it))}"></div></div>
    <div class="sh-info"><div class="sh-nm"><b>${esc(it.name)}</b>${it.size ? ` <span>${esc(it.size)}</span>` : ""}</div>
    <div class="sh-spec">${it.spec ? esc(it.spec) + " · " : ""}موديل <span class="n" style="font-weight:600">${esc(it.model)}</span></div>
    <div class="sh-pr"><div><div class="p n">${it.price}${SHK}</div><div class="o n">${it.old}${SHK}</div></div>
      <span class="save">وفّر <span class="n">${it.old - it.price}</span> ₪</span></div>
    <div class="sh-btns"><a class="wa" href="${waLink(it)}" target="_blank" rel="noopener">${WA} اطلب بالواتساب</a>
      <button class="share" onclick="share('${it.id}')" aria-label="شارك">${SHARE}</button>${addBig("p:" + it.id)}</div></div>`;
  $("#pop").classList.add("open");
  if (push) history.pushState({ p: id }, "", "#p=" + id);
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#pop").classList.contains("open")) closeSheet(); });
function closeSheet(pop) { $("#pop").classList.remove("open"); if (!pop && /^#(p=|w=|list)/.test(location.hash)) history.back(); }
async function share(id) {
  const it = BYID[id], url = location.href.split("#")[0] + "#p=" + id;
  const text = `${title(it)} بـ ${it.price} ₪ بدل ${it.old} ₪ · عروض Black November من كهرباء أبو غوش`;
  if (navigator.share) { try { await navigator.share({ title: "Black November", text, url }); } catch (e) {} }
  else window.open(`https://wa.me/?text=${encodeURIComponent(text + "\n" + url)}`, "_blank");
}
window.addEventListener("popstate", () => { if (location.hash.startsWith("#p=")) openSheet(location.hash.slice(3), false); else if (location.hash.startsWith("#w=")) openWed(location.hash.slice(3), false); else if (location.hash === "#list") openList(false); else closeSheet(true); });
$("#list").addEventListener("click", e => {
  const a = e.target.closest(".add"); if (a) { toggleList(a.dataset.k); return; }
  const b = e.target.closest(".wbud"); if (b) { BUD = b.dataset.b; document.getElementById("c-wedding").outerHTML = wedSection(); return; }
  const w = e.target.closest(".wcard"); if (w) { openWed(w.dataset.w); return; }
  const c = e.target.closest(".card"); if (c) openSheet(c.dataset.id);
});
let t; $("#q").addEventListener("input", e => { clearTimeout(t); t = setTimeout(() => render(e.target.value), 150); });

const fitBar = () => { const b = $("#bar").offsetHeight; document.documentElement.style.scrollPaddingTop = (b + 12) + "px"; document.documentElement.style.setProperty("--bar-h", b + "px"); };
fitBar(); addEventListener("resize", fitBar);
$("#lbar .go").innerHTML = WA + "اسأل عالواتس";
const V = document.lastModified.replace(/\D/g, "");
Promise.all([fetch("data.json?v=" + V).then(r => r.json()), fetch("wedding.json?v=" + V).then(r => r.json())]).then(([d, w]) => {
  D = d; WED = w; d.items.forEach(it => BYID[it.id] = it);
  chips(); fitBar(); render();
  if (location.hash.startsWith("#p=")) openSheet(location.hash.slice(3), false);
  if (location.hash.startsWith("#w=")) openWed(location.hash.slice(3), false);
  if (location.hash === "#list") openList(false);
  lbar();
});
</script>
</body>
</html>
